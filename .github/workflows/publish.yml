name: Publish Docker image

# Push to main: test, then publish takecharge/grocery-assistant:latest and :<sha>.
# Push a tag vX.Y.Z: also publish :X.Y.Z and bump the pinned tag in
# compose.example.yml and README.md on main. The server runs a pinned tag, so only a
# version tag (plus a manual edit of the stack's compose file) ships anything.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  IMAGE: takecharge/grocery-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Bump version in files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|${IMAGE}:[0-9][0-9.]*|${IMAGE}:${VERSION}|g" README.md compose.example.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md compose.example.yml
          git diff --cached --quiet || git commit -m "Bump image tag to v${VERSION}"
          git push origin HEAD:refs/heads/main
