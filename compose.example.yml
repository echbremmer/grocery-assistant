# Example stack. The live copy is /mnt/stacks/grocery-assistant/docker-compose.yml.
# The image is built by GitHub Actions and published to Docker Hub; pushing a
# tag vX.Y.Z bumps the tag below. To upgrade, change the tag in the live copy
# and run: docker compose up -d
services:
  grocery-assistant:
    container_name: grocery-assistant
    image: takecharge/grocery-assistant:0.1.0
    restart: unless-stopped
    user: "568:568"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../defaults.env   # TZ
      - .env              # MATTERMOST_WEBHOOK_<NAME>=https://<mattermost host>/hooks/<id>
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
