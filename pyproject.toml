[project]
name = "grocery-assistant"
version = "0.2.0"
description = "Posts supermarket bonus offers to Mattermost on a schedule"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
grocery-assistant = "grocery_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_assistant"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
